<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mycelium</title>
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="86%">
      <stop offset="0%" stop-color="#20342a"/>
      <stop offset="62%" stop-color="#13201a"/>
      <stop offset="100%" stop-color="#0b120f"/>
    </radialGradient>
    <linearGradient id="hypha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4eed5"/>
      <stop offset="100%" stop-color="#b9cda1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="26" y="26" width="972" height="972" rx="202" fill="none"
        stroke="#42573f" stroke-opacity="0.55" stroke-width="6"/>

  <!-- Older hyphae: the network this spore grew out of. -->
  <g fill="none" stroke="#7f9a6c" stroke-opacity="0.5" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 236 470 C 300 470, 330 520, 340 610"/>
    <path d="M 788 470 C 724 470, 694 520, 684 610"/>
    <path d="M 330 790 C 400 760, 460 754, 512 754"/>
    <path d="M 694 790 C 624 760, 564 754, 512 754"/>
  </g>

  <!-- The M: one filament that forks at its three joints. -->
  <g filter="url(#glow)">
    <path d="M 300 716 L 358 358 Q 366 322 398 350 L 512 560 L 626 350 Q 658 322 666 358 L 724 716"
          fill="none" stroke="url(#hypha)" stroke-width="60"
          stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="none" stroke="#c9dbb4" stroke-width="34" stroke-linecap="round">
      <path d="M 366 344 C 320 300, 280 274, 232 260"/>
      <path d="M 658 344 C 704 300, 744 274, 792 260"/>
      <path d="M 512 552 C 512 640, 512 700, 512 766"/>
    </g>

    <!-- Spores at every joint and tip. -->
    <g fill="#e9f1dc">
      <circle cx="366" cy="344" r="30"/>
      <circle cx="512" cy="552" r="30"/>
      <circle cx="658" cy="344" r="30"/>
      <circle cx="232" cy="260" r="22"/>
      <circle cx="792" cy="260" r="22"/>
      <circle cx="512" cy="766" r="22"/>
      <circle cx="300" cy="716" r="18"/>
      <circle cx="724" cy="716" r="18"/>
    </g>
  </g>
</svg>
