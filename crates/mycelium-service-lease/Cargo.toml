[package]
name = "mycelium-service-lease"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Publish an application service lease into the catalog myceliumd observes"

[dependencies]
fpl-resource-observation = { path = "../fpl-resource-observation" }
# One naming rule: a lease carries the label it asks for and the zone composes
# the name, so validation must be the zone's own, not a second copy here.
mycelium-dns-policy = { path = "../mycelium-dns-policy" }
# Reading a Spore's `spore.toml` is the interface, not a dependency on soil: the
# manifest is a file, so the package format and the mesh stay uncoupled.
toml = "0.8"
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
